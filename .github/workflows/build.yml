# بناء IPA غير موقّع (لتوقيعه بشهادتك) + APK للتجربة
# يعمل مع كل Push على main، أو يدوياً من تبويب Actions ▸ Build apps ▸ Run workflow
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "docs/**", "store/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write   # لنشر الملفات في Releases برابط مباشر

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://ghanigroup.online

jobs:
  ios:
    name: iOS — IPA غير موقّع
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز المنصات (أيقونات، شاشة البداية، إعدادات Xcode)
        run: bash tool/prepare_platforms.sh

      - name: الاختبارات
        run: flutter test

      - name: بناء التطبيق بدون توقيع
        run: flutter build ios --release --no-codesign --dart-define=SITE_URL=$SITE_URL

      # توقيع وهمي (ad-hoc / fakesign) — نفس شكل الـ IPA المتداول لأدوات
      # ESign / Feather / Scarlet / Sideloadly / TrollStore، حتى تعيد توقيعه بشهادتك
      - name: تغليف IPA (fakesign)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          APP=build/ipa/Payload/Runner.app
          find "$APP" -name '_CodeSignature' -type d -prune -exec rm -rf {} +
          rm -f "$APP/embedded.mobileprovision"
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$f" ] && codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$APP"
          codesign -dv "$APP" 2>&1 | head -5
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion'
          cd build/ipa
          zip -qry "GhaniGroup-${VERSION}.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GhaniGroup-iOS-ipa
          path: build/ipa/*.ipa
          retention-days: 30

      # رابط .ipa مباشر (بدون zip) في صفحة Releases
      - name: نشر في Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: آخر نسخة iOS
          prerelease: true
          make_latest: false
          body: "IPA جاهز لإعادة التوقيع بشهادتك (ESign / Feather / Sideloadly …). Bundle ID: online.ghanigroup.app"
          files: build/ipa/*.ipa

  android:
    name: Android — APK للتجربة
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز المنصات
        run: bash tool/prepare_platforms.sh

      # أخطاء التحليل تظهر كتنبيهات (annotations) في صفحة البناء
      - name: تحليل الكود
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "^ *error" analyze.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          grep -qE "^ *error" analyze.txt && exit 1 || true

      - name: بناء APK
        run: flutter build apk --release --dart-define=SITE_URL=$SITE_URL

      - uses: actions/upload-artifact@v4
        with:
          name: GhaniGroup-Android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: نشر في Releases
        run: cp build/app/outputs/flutter-apk/app-release.apk GhaniGroup.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: آخر نسخة Android
          prerelease: true
          make_latest: false
          files: GhaniGroup.apk
