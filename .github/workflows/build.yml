# بناء IPA غير موقّع (لتوقيعه بشهادتك) + APK للتجربة
# يعمل مع كل Push على main، أو يدوياً من تبويب Actions ▸ Build apps ▸ Run workflow
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "docs/**", "store/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://ghanigroup.online

jobs:
  ios:
    name: iOS — IPA غير موقّع
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز المنصات (أيقونات، شاشة البداية، إعدادات Xcode)
        run: bash tool/prepare_platforms.sh

      - name: الاختبارات
        run: flutter test

      - name: بناء التطبيق بدون توقيع
        run: flutter build ios --release --no-codesign --dart-define=SITE_URL=$SITE_URL

      - name: تغليف IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "GhaniGroup-${VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GhaniGroup-iOS-unsigned-ipa
          path: build/ipa/*.ipa
          retention-days: 30

  android:
    name: Android — APK للتجربة
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تجهيز المنصات
        run: bash tool/prepare_platforms.sh

      - name: بناء APK
        run: flutter build apk --release --dart-define=SITE_URL=$SITE_URL

      - uses: actions/upload-artifact@v4
        with:
          name: GhaniGroup-Android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
