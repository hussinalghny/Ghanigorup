<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{BASE}}">
<title>{{TITLE}} — {{COMPANY}}</title>
<link rel="icon" href="assets/brand/favicon-64.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F0EB;--sf:#fff;--ink:#141414;--mut:#6f6b65;--line:#E6E2DA;--red:#B82619}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Alexandria',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.95;font-size:15px}
.top{background:var(--red);color:#fff;padding:22px 20px}
.top .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;object-fit:contain}
.top a{color:#fff;text-decoration:none;font-weight:600}
.top nav{margin-inline-start:auto;display:flex;gap:16px;font-size:13px}
.top nav a{font-weight:400;opacity:.85}
main{max-width:820px;margin:0 auto;padding:34px 20px 70px}
h1{font-size:30px;font-weight:600;line-height:1.3;margin-bottom:6px}
.upd{color:var(--mut);font-size:13px;margin-bottom:26px}
h2{font-size:19px;font-weight:600;margin:30px 0 8px}
p,li{color:#2b2a28}
ul{padding-inline-start:22px;margin:8px 0}
.card{background:var(--sf);border-radius:22px;padding:24px;margin-top:18px}
.en{direction:ltr;text-align:left;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.en h2{font-family:inherit}
hr{border:0;border-top:1px solid var(--line);margin:40px 0}
a{color:var(--red)}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font:inherit;background:var(--bg);outline:0}
input:focus{border-color:var(--ink);background:#fff}
button{margin-top:18px;height:52px;border:0;border-radius:16px;background:var(--red);color:#fff;font:inherit;font-weight:600;padding:0 26px;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:14px;padding:12px 16px;border-radius:14px;font-size:14px;display:none}
.msg.ok{display:block;background:#E3F1E6;color:#2C7A45}.msg.err{display:block;background:#FBE3E5;color:#B82619}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:0 20px 40px}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="assets/brand/mark.png" alt=""><a href="./">{{COMPANY}}</a>
<nav><a href="privacy">الخصوصية</a><a href="terms">الشروط</a><a href="support">الدعم</a></nav></div></header>
<main>
{{CONTENT}}
</main>
<footer>© {{YEAR}} {{COMPANY_AR}} — {{ADDRESS}}</footer>
<script src="assets/pages/pages.js"></script>
</body>
</html>
